<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CuyStream AI Pro | Video Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --accent-color: #d5c192;
            --border-color: #262626;
            --text-main: #ffffff;
            --text-muted: #8e8e8e;
            --input-bg: #1f1f1f;
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; overflow: hidden; }

        /* --- Header --- */
        header {
            height: 64px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 40px; border-bottom: 1px solid var(--border-color);
            background: rgba(10, 10, 10, 0.8); backdrop-filter: blur(12px);
            position: fixed; top: 0; width: 100%; z-index: 100;
        }
        .logo { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.5px; }
        .logo span { color: var(--accent-color); }
        
        .header-actions { display: flex; gap: 12px; }
        .btn-icon {
            background: var(--card-bg); border: 1px solid var(--border-color);
            color: var(--text-main); width: 38px; height: 38px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: 0.2s;
        }
        .btn-icon:hover { border-color: var(--accent-color); }

        /* --- Main Layout --- */
        main {
            margin-top: 64px; height: calc(100vh - 64px);
            display: grid; grid-template-columns: 400px 1fr;
        }

        /* --- Sidebar Config --- */
        .sidebar {
            padding: 32px; background-color: var(--card-bg);
            border-right: 1px solid var(--border-color); overflow-y: auto;
        }
        .form-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; margin-bottom: 20px; display: block; }

        .upload-area {
            width: 100%; height: 200px; border: 2px dashed var(--border-color);
            border-radius: var(--radius); display: flex; flex-direction: column;
            align-items: center; justify-content: center; cursor: pointer;
            position: relative; overflow: hidden; margin-bottom: 24px; transition: 0.2s;
        }
        .upload-area:hover { border-color: var(--accent-color); }
        .upload-area img { width: 100%; height: 100%; object-fit: cover; position: absolute; display: none; }
        
        .field-group { margin-bottom: 20px; }
        .field-group label { display: block; margin-bottom: 8px; font-size: 0.85rem; font-weight: 500; }
        
        input, textarea {
            width: 100%; background: var(--input-bg); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 12px; color: var(--text-main);
            font-size: 0.9rem; outline: none; transition: 0.2s;
        }
        input:focus, textarea:focus { border-color: var(--accent-color); }
        textarea { resize: none; height: 100px; }

        .btn-primary {
            width: 100%; padding: 14px; background-color: var(--accent-color);
            color: #000; border: none; border-radius: 8px; font-weight: 700;
            cursor: pointer; transition: 0.3s;
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }

        /* --- Preview Area --- */
        .preview-content {
            padding: 40px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; position: relative;
        }
        .video-wrapper {
            width: 100%; max-width: 850px; aspect-ratio: 16/9;
            background: #000; border-radius: var(--radius);
            box-shadow: 0 40px 80px rgba(0,0,0,0.6); display: none;
            overflow: hidden; border: 1px solid var(--border-color);
        }
        video { width: 100%; height: 100%; }

        .placeholder-text { text-align: center; color: var(--text-muted); }
        .placeholder-text h2 { color: var(--text-main); margin-bottom: 8px; }

        /* --- Settings Panel --- */
        .settings-panel {
            position: fixed; right: -360px; top: 0; width: 360px; height: 100vh;
            background: var(--card-bg); border-left: 1px solid var(--border-color);
            z-index: 200; padding: 40px; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .settings-panel.active { right: 0; }

        /* --- Loader --- */
        .loader-screen {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            display: none; place-items: center; z-index: 1000;
        }
        .spinner {
            width: 40px; height: 40px; border: 3px solid #222;
            border-top-color: var(--accent-color); border-radius: 50%;
            animation: spin 0.8s linear infinite; margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 1024px) {
            main { grid-template-columns: 1fr; overflow-y: auto; }
            .sidebar { border-right: none; height: auto; }
            .preview-content { height: 500px; }
        }
    </style>
</head>
<body>

    <div class="loader-screen" id="loader">
        <div style="text-align: center;">
            <div class="spinner" style="margin: 0 auto 16px;"></div>
            <p id="loader-msg">Menganalisis Data...</p>
        </div>
    </div>

    <header>
        <div class="logo">CUY<span>STREAM</span></div>
        <div class="header-actions">
            <button class="btn-icon" id="settings-btn" title="API Configuration">⚙️</button>
        </div>
    </header>

    <main>
        <section class="sidebar">
            <span class="form-label">Video Configuration</span>
            
            <div class="upload-area" id="upload-box">
                <img id="image-preview" src="">
                <div id="placeholder-ui">
                    <p style="font-weight: 600;">Klik untuk Upload Foto</p>
                    <p style="font-size: 0.75rem; color: var(--text-muted);">PNG, JPG (Maks. 5MB)</p>
                </div>
            </div>
            <input type="file" id="file-input" hidden accept="image/*">

            <div class="field-group">
                <label>Deskripsi Video</label>
                <textarea id="prompt-input" placeholder="Jelaskan aksi yang ingin dilakukan..."></textarea>
            </div>

            <div class="field-group">
                <label>Latar Belakang</label>
                <input type="text" id="bg-input" placeholder="Lokasi atau suasana...">
            </div>

            <div class="field-group">
                <label>Kualitas Video</label>
                <input type="text" id="quality-input" placeholder="Misal: 4K, Cinematic, High Resolution...">
            </div>

            <button class="btn-primary" id="generate-btn">GENERATE VIDEO</button>
        </section>

        <section class="preview-content">
            <div class="placeholder-text" id="preview-placeholder">
                <div style="font-size: 3rem; margin-bottom: 16px; opacity: 0.2;">🎞️</div>
                <h2>Siap untuk Memulai?</h2>
                <p>Isi konfigurasi di samping untuk melihat hasil render AI.</p>
            </div>

            <div class="video-wrapper" id="video-container">
                <video id="video-player" controls></video>
                <div style="margin-top: 24px; display: flex; gap: 12px; width: 100%;">
                    <button class="btn-primary" id="download-btn">DOWNLOAD VIDEO</button>
                    <button class="btn-primary" style="background: #222; color: #fff; flex: 0.3;" onclick="location.reload()">RESET</button>
                </div>
            </div>
        </section>
    </main>

    <aside class="settings-panel" id="settings-panel">
        <h2 style="margin-bottom: 24px;">API Settings</h2>
        <div class="field-group">
            <label>Google Gemini API Key</label>
            <input type="password" id="api-key-input" placeholder="Masukkan Key Anda">
        </div>
        <div class="field-group">
            <label>Model Engine</label>
            <input type="text" id="model-input" value="gemini-1.5-flash">
        </div>
        <button class="btn-primary" id="save-settings-btn">SIMPAN KONFIGURASI</button>
    </aside>

    <script>
        // DOM Elements
        const uploadBox = document.getElementById('upload-box');
        const fileInput = document.getElementById('file-input');
        const imagePreview = document.getElementById('image-preview');
        const settingsBtn = document.getElementById('settings-btn');
        const settingsPanel = document.getElementById('settings-panel');
        const generateBtn = document.getElementById('generate-btn');
        const loader = document.getElementById('loader');

        // Toggle Settings
        settingsBtn.onclick = () => settingsPanel.classList.toggle('active');

        // Handle File Upload
        uploadBox.onclick = () => fileInput.click();
        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    imagePreview.src = event.target.result;
                    imagePreview.style.display = 'block';
                    document.getElementById('placeholder-ui').style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        };

        // Save Settings to LocalStorage
        document.getElementById('save-settings-btn').onclick = () => {
            localStorage.setItem('gemini_api_key', document.getElementById('api-key-input').value);
            localStorage.setItem('gemini_model', document.getElementById('model-input').value);
            settingsPanel.classList.remove('active');
            alert('Konfigurasi Berhasil Disimpan.');
        };

        // Load Initial Settings
        document.getElementById('api-key-input').value = localStorage.getItem('gemini_api_key') || '';

        // Real API Call Implementation
        generateBtn.onclick = async () => {
            const apiKey = localStorage.getItem('gemini_api_key');
            const model = localStorage.getItem('gemini_model') || 'gemini-1.5-flash';
            const prompt = document.getElementById('prompt-input').value;
            const bg = document.getElementById('bg-input').value;
            const quality = document.getElementById('quality-input').value;

            if (!apiKey) {
                alert('Silakan masukkan API Key Gemini di menu Settings (⚙️).');
                return;
            }
            if (!imagePreview.src || !prompt) {
                alert('Foto dan Deskripsi wajib diisi.');
                return;
            }

            loader.style.display = 'grid';

            try {
                const base64Data = imagePreview.src.split(',')[1];

                // MANGGIL API GEMINI
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: `User Prompt: ${prompt}. Background: ${bg}. Quality Target: ${quality}. Tugas Anda adalah menganalisis foto ini dan merumuskan instruksi teknis (Pro Prompt) untuk generator video AI agar menghasilkan gerakan yang realistis.` },
                                { inline_data: { mime_type: "image/jpeg", data: base64Data } }
                            ]
                        }]
                    })
                });

                const result = await response.json();
                
                if (result.error) throw new Error(result.error.message);

                // Menampilkan Log Hasil Analisis Gemini di Console
                console.log("Analisis Gemini:", result.candidates[0].content.parts[0].text);

                // Simulasi Proses Pembuatan Video (Tahap Render)
                document.getElementById('loader-msg').innerText = "Gemini Selesai Menganalisis. Sedang Merender Video...";
                
                setTimeout(() => {
                    loader.style.display = 'none';
                    document.getElementById('preview-placeholder').style.display = 'none';
                    document.getElementById('video-container').style.display = 'block';
                    
                    const player = document.getElementById('video-player');
                    player.src = "https://www.w3schools.com/html/mov_bbb.mp4"; // Placeholder
                    player.play();
                }, 3000);

            } catch (error) {
                loader.style.display = 'none';
                alert("Kesalahan API: " + error.message);
            }
        };

        // Download Video=
        document.getElementById('download-btn').onclick = () => {
            const link = document.createElement('a');
            link.href = document.getElementById('video-player').src;
            link.download = "cuy-generated-video.mp4";
            link.click();
        };
    </script>
</body>
</html>
